<!DOCTYPE html>

<html lang="th"><head>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;

        /* Doodle elements */
        .doodle-border {
            border: 3px solid #1c1b1b;
            border-radius: 12px;
            box-shadow: 4px 4px 0px 0px #1c1b1b;
        }
        .doodle-border-thin {
            border: 2px solid #1c1b1b;
            border-radius: 8px;
            box-shadow: 2px 2px 0px 0px #1c1b1b;
        }
        .active-sink:active {
            transform: translate(4px, 4px);
            box-shadow: none !important;
        }
        .doodle-star {
            position: absolute;
            width: 24px;
            height: 24px;
            background-color: #d6ff00;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);

        }
        .doodle-line {
            position: absolute;
            background-color: #1c1b1b;
            height: 3px;
            border-radius: 3px;
        }

                        "outline-variant": "#c5c9ac",

<body class="bg-background text-on-background font-body-md flex flex-col relative" style="min-height: 100vh;">
<!-- Decorative background doodles -->
<div class="absolute top-10 left-10 w-8 h-8 rounded-full border-[3px] border-on-background opacity-20 pointer-events-none"></div>
<div class="absolute bottom-20 right-10 w-12 h-12 rotate-45 border-[3px] border-on-background opacity-20 pointer-events-none"></div>
<div class="doodle-star top-20 right-20 rotate-12 opacity-50 pointer-events-none"></div>
<div class="doodle-line top-1/4 left-1/2 w-16 -rotate-12 opacity-30 pointer-events-none"></div>
<div class="doodle-line bottom-1/3 left-10 w-10 rotate-45 opacity-30 pointer-events-none"></div>
<!-- Top App Bar -->
<header class="flex justify-between items-center w-full px-margin-mobile h-16 bg-background border-b-[3px] border-on-background shadow-[4px_4px_0px_0px_rgba(28,27,27,1)] relative z-10"><div class="flex items-center gap-4"><button class="w-10 h-10 flex items-center justify-center doodle-border-thin bg-surface-container-low active-sink transition-all hover:bg-surface-container"><span class="material-symbols-outlined text-on-background">arrow_back</span></button><div><h1 class="font-headline-lg-mobile text-[20px] leading-tight uppercase tracking-tighter text-on-background">MATCH LIVE</h1><div class="bg-primary-container px-2 py-0.5 rounded-full doodle-border-thin font-label-sm text-[10px] uppercase inline-block">Court 4 • Finals</div></div></div><div class="w-10 h-10 rounded-full border-[3px] border-on-background overflow-hidden relative doodle-border-thin"><img alt="User avatar" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBtUwgzyQIsfFhBVl_SrWWKaCnbP_ifR2LUWkvRhq5wS5IfAo9s3RvYfIfu1-ExMDZZc049PGiI3PCf-66uqva76tA_-20mHs2iwbDQaNiAgu9EU59_o0rLTtYi5JEkCrlObj2t5TeXzT0Uh53baH66bxJr8GdLD28392n_GDgmWCcwh5bg5D9CUqln0TWwnchngRixcsQM15cl5Ud_x-pHzyAbzI9nuiYZKVXvV-C3Uk0pLGa6BU6-JLnTsiLpc9XjRlecIMGbDikB"/></div></header>
<!-- Main Scoreboard Canvas -->
<main class="flex-1 flex flex-col items-center justify-start p-4 relative w-full max-w-6xl mx-auto gap-6 mt-4"><div class="flex flex-col lg:flex-row w-full items-stretch justify-center gap-6 lg:gap-12 flex-1"><div class="flex flex-col items-center flex-1 relative group max-w-md mx-auto w-full"><div class="absolute inset-0 bg-error-container rounded-[24px] -rotate-2 -z-10 doodle-border"></div><div class="bg-surface-container-lowest w-full flex flex-col items-center justify-between p-6 doodle-border relative h-full min-h-[300px]"><span class="font-label-sm text-lg uppercase bg-error text-on-error px-4 py-1 rounded-sm doodle-border-thin absolute -top-4">Red Side</span><div class="flex-1 flex items-center justify-center"><span class="font-display-lg text-[120px] sm:text-[160px] leading-none text-on-background" id="score-red">14</span></div><div class="flex gap-4 w-full mt-4"><button class="flex-1 h-16 bg-surface-container-highest flex items-center justify-center doodle-border-thin active-sink text-2xl" onclick="updateScore('red', -1)"><span class="material-symbols-outlined text-[32px]">remove</span></button><button class="flex-1 h-16 bg-primary-container flex items-center justify-center doodle-border-thin active-sink text-2xl" onclick="updateScore('red', 1)"><span class="material-symbols-outlined text-[32px] font-bold">add</span></button></div></div></div><div class="flex flex-row lg:flex-col items-center justify-center gap-4 py-4"><div class="w-12 h-1 lg:w-1 lg:h-12 bg-on-background rounded-full"></div><div class="flex flex-col items-center"><span class="font-label-sm text-sm text-on-surface-variant font-bold">SET 2</span><span class="font-headline-lg text-2xl">VS</span></div><div class="w-12 h-1 lg:w-1 lg:h-12 bg-on-background rounded-full"></div></div><div class="flex flex-col items-center flex-1 relative group max-w-md mx-auto w-full"><div class="absolute inset-0 bg-secondary-container rounded-[24px] rotate-2 -z-10 doodle-border"></div><div class="bg-surface-container-lowest w-full flex flex-col items-center justify-between p-6 doodle-border relative h-full min-h-[300px]"><span class="font-label-sm text-lg uppercase bg-secondary text-on-secondary px-4 py-1 rounded-sm doodle-border-thin absolute -top-4">Blue Side</span><div class="flex-1 flex items-center justify-center"><span class="font-display-lg text-[120px] sm:text-[160px] leading-none text-on-background" id="score-blue">20</span></div><div class="flex gap-4 w-full mt-4"><button class="flex-1 h-16 bg-surface-container-highest flex items-center justify-center doodle-border-thin active-sink text-2xl" onclick="updateScore('blue', -1)"><span class="material-symbols-outlined text-[32px]">remove</span></button><button class="flex-1 h-16 bg-primary-container flex items-center justify-center doodle-border-thin active-sink text-2xl" onclick="updateScore('blue', 1)"><span class="material-symbols-outlined text-[32px] font-bold">add</span></button></div></div></div></div><div class="w-full flex flex-col sm:flex-row gap-4 justify-center items-center mt-8 pb-8"><button class="w-full sm:w-auto px-12 py-4 bg-primary-container text-on-background font-headline-lg-mobile text-[20px] uppercase doodle-border shadow-[6px_6px_0px_0px_rgba(28,27,27,1)] active-sink hover:bg-primary-fixed transition-colors flex items-center justify-center gap-2 rotate-1"><span class="material-symbols-outlined">done_all</span>จบเกม (End Match)</button><button class="w-full sm:w-auto px-8 py-3 bg-transparent text-on-background font-label-sm uppercase border-[2px] border-dashed border-on-background rounded-lg hover:bg-surface-container transition-colors flex items-center justify-center gap-2 -rotate-1"><span class="material-symbols-outlined text-sm">history</span>Undo Last Point</button></div></main>
<!-- Bottom Nav Bar Suppression: This is a focused task/live screen, nav should be hidden to prioritize the canvas -->
<script>
        function updateScore(team, change) {
            const scoreElement = document.getElementById(`score-${team}`);
            let currentScore = parseInt(scoreElement.innerText);
            let newScore = currentScore + change;
            if (newScore < 0) newScore = 0;
            scoreElement.innerText = newScore;

            // Add a little pop effect
            scoreElement.style.transform = 'scale(1.2)';
            setTimeout(() => {
                scoreElement.style.transform = 'scale(1)';
            }, 150);
        }
    </script>
</body></html>
